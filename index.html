<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>逻辑填空 · 易混词语辨析闭环</title>
<style>
:root{
  --bg:#f6f4ef; --card:#fffdf9; --ink:#22201d; --ink2:#5c574f; --ink3:#8d877d;
  --line:#e7e2d8; --accent:#b4452f; --accent-soft:#f3e3dd; --green:#3f7d5c; --blue:#3a6ea5;
  --shadow:0 1px 2px rgba(34,32,29,.05),0 8px 24px -12px rgba(34,32,29,.18);
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ---------- 顶栏 ---------- */
header{
  position:sticky;top:0;z-index:50;background:rgba(246,244,239,.88);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.hd{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:18px}
.logo{display:flex;align-items:center;gap:10px;flex:none}
.logo .mark{
  width:30px;height:30px;border-radius:9px;background:var(--ink);color:#fff;
  display:grid;place-items:center;font-size:14px;font-weight:700;letter-spacing:.5px;
}
.logo h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.3px}
.logo .sub{font-size:11px;color:var(--ink3);letter-spacing:.5px;margin-top:-2px}
nav{display:flex;gap:2px;background:#eeeade;border-radius:10px;padding:3px;margin-left:auto}
nav button{padding:6px 14px;border-radius:8px;font-size:13.5px;color:var(--ink2);transition:.15s;white-space:nowrap}
nav button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.07)}
nav button:hover:not(.on){color:var(--ink)}

/* ---------- 容器 ---------- */
main{max-width:1180px;margin:0 auto;padding:24px 20px 80px}
.page{display:none;animation:fade .25s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- 首页 ---------- */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:22px}
.hero h2{font-size:26px;margin:0 0 6px;letter-spacing:-.3px}
.hero p{margin:0;color:var(--ink2);font-size:13.5px;max-width:640px}
.stats{display:flex;gap:26px}
.stat b{display:block;font-size:24px;font-weight:700;letter-spacing:-.5px;line-height:1.2}
.stat span{font-size:11.5px;color:var(--ink3);letter-spacing:.4px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.search{flex:1;min-width:220px;position:relative}
.search input{
  width:100%;padding:10px 14px 10px 38px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);font-size:14px;outline:none;color:var(--ink);transition:.15s;
}
.search input:focus{border-color:#c9c0ad;box-shadow:0 0 0 3px rgba(180,69,47,.07)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.4}
.chip{
  padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  font-size:13px;color:var(--ink2);transition:.15s;white-space:nowrap;
}
.chip:hover{border-color:#c9c0ad;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.themes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tcard{
  background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 14px;
  display:flex;align-items:center;gap:9px;transition:.15s;font-size:13.5px;
}
.tcard:hover{border-color:#c9c0ad;transform:translateY(-1px);box-shadow:var(--shadow)}
.tcard.on{border-color:var(--ink);background:#fbf8f0}
.tcard em{font-style:normal;font-size:11.5px;color:var(--ink3)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.gcard{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;transition:.18s;cursor:pointer;position:relative;overflow:hidden;
}
.gcard:hover{border-color:#cfc6b2;box-shadow:var(--shadow);transform:translateY(-2px)}
.gcard .tag{font-size:11px;color:var(--ink3);letter-spacing:.4px;display:flex;gap:8px;align-items:center}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.gcard h3{font-size:17px;margin:8px 0 10px;font-weight:700;letter-spacing:-.2px;line-height:1.4}
.gcard h3 .sep{color:var(--ink3);font-weight:400;margin:0 4px;font-size:14px}
.gcard .keys{font-size:12.5px;color:var(--ink2);display:flex;flex-direction:column;gap:5px}
.gcard .keys div{display:flex;gap:7px;align-items:baseline}
.gcard .keys i{font-style:normal;font-weight:600;color:var(--ink);flex:none}
.gcard .keys span{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcard .more{margin-top:11px;font-size:12px;color:var(--accent);opacity:0;transition:.2s}
.gcard:hover .more{opacity:1}

/* ---------- 详情弹层 ---------- */
.modal{
  position:fixed;inset:0;z-index:100;display:none;
  background:rgba(30,28,25,.42);backdrop-filter:blur(3px);
  padding:32px 16px;overflow-y:auto;
}
.modal.on{display:block}
.sheet{
  max-width:1000px;margin:0 auto;background:var(--card);border-radius:18px;
  box-shadow:0 24px 80px -20px rgba(0,0,0,.4);overflow:hidden;animation:up .28s cubic-bezier(.2,.8,.3,1);
}
@keyframes up{from{opacity:0;transform:translateY(18px) scale(.99)}to{opacity:1;transform:none}}
.sheet-hd{
  padding:20px 26px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;
  align-items:flex-start;gap:16px;position:sticky;top:0;background:var(--card);z-index:2;
}
.sheet-hd h3{margin:0 0 3px;font-size:21px;letter-spacing:-.2px}
.sheet-hd .meta{font-size:12px;color:var(--ink3)}
.close{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--ink3);flex:none}
.close:hover{background:#f1ece1;color:var(--ink)}
.sheet-bd{padding:18px 26px 28px}

.cmp{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.cmp th{
  text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.6px;color:var(--ink3);
  padding:0 12px 8px;border-bottom:1px solid var(--line);
}
.cmp td{padding:13px 12px;border-bottom:1px solid #f0ece2;vertical-align:top}
.cmp tr:last-child td{border-bottom:none}
.cmp td.w{font-weight:700;font-size:15px;white-space:nowrap;width:98px;letter-spacing:-.2px}
.cmp td.w small{display:block;font-weight:400;font-size:11px;color:var(--ink3);letter-spacing:0}
.cmp td.key{color:var(--ink);min-width:180px}
.cmp td.def{color:var(--ink2);font-size:13px}
.dim{
  display:inline-block;margin-top:5px;padding:1px 8px;border-radius:6px;font-size:11px;
  background:var(--accent-soft);color:var(--accent);letter-spacing:.3px;
}
.eg{font-size:12.5px;color:var(--ink2);margin:0;padding-left:14px;border-left:2px solid var(--line);line-height:1.7}
.eg li{margin:3px 0;list-style:none;position:relative}
.eg li::before{content:"";position:absolute;left:-14px;top:.72em;width:6px;height:1px;background:#d6cfc0}

/* ---------- 闪卡 ---------- */
.fc-wrap{max-width:640px;margin:0 auto}
.fc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:13px;color:var(--ink2)}
.progress{height:4px;background:#e9e4d8;border-radius:2px;overflow:hidden;margin-bottom:26px}
.progress i{display:block;height:100%;background:var(--ink);transition:width .3s;border-radius:2px}
.fcard{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  min-height:330px;padding:30px;display:flex;flex-direction:column;
  box-shadow:var(--shadow);cursor:pointer;transition:.2s;
}
.fcard:hover{border-color:#d4cbb6}
.fcard .q{font-size:12px;color:var(--ink3);letter-spacing:.6px;margin-bottom:16px}
.fcard .big{font-size:30px;font-weight:700;letter-spacing:1px;margin-bottom:8px}
.fcard .grp{font-size:12.5px;color:var(--ink3);margin-bottom:auto}
.ans{border-top:1px dashed var(--line);margin-top:18px;padding-top:16px;display:none}
.ans.on{display:block;animation:fade .2s}
.ans .k{font-size:14px;color:var(--ink);margin-bottom:8px;line-height:1.7}
.ans .d{font-size:12.5px;color:var(--ink2)}
.fc-btns{display:flex;gap:10px;margin-top:18px}
.btn{
  flex:1;padding:11px;border-radius:10px;background:var(--card);border:1px solid var(--line);
  font-size:14px;color:var(--ink);transition:.15s;font-weight:500;
}
.btn:hover{border-color:#c9c0ad;background:#fbf8f0}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#3a352f}
.btn.good{background:#eef5ef;border-color:#cfe3d6;color:var(--green)}
.btn.bad{background:#fbeeea;border-color:#efcfc6;color:var(--accent)}
.hint{text-align:center;font-size:12px;color:var(--ink3);margin-top:14px}

/* ---------- 测验 ---------- */
.quiz{max-width:760px;margin:0 auto}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 28px;box-shadow:var(--shadow)}
.qstem{font-size:16px;line-height:1.8;margin-bottom:20px}
.qstem b{color:var(--accent);font-weight:600}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  text-align:left;padding:13px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  font-size:14.5px;transition:.15s;display:flex;gap:10px;align-items:flex-start;
}
.opt:hover{border-color:#c9c0ad;background:#fbf8f0}
.opt .idx{font-size:12px;color:var(--ink3);flex:none;width:16px;padding-top:2px}
.opt.right{background:#eef5ef;border-color:#8cbf9f;color:#2f6a4b}
.opt.wrong{background:#fbeeea;border-color:#e0a99a;color:#9c3520}
.opt.dis{opacity:.55}
.explain{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line);font-size:13px;color:var(--ink2);display:none}
.explain.on{display:block;animation:fade .2s}
.explain .why{color:var(--ink);margin-bottom:6px}
.qbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:13px;color:var(--ink2)}
.score{font-weight:700;color:var(--ink)}

/* ---------- 词库 ---------- */
table.lib{width:100%;border-collapse:collapse;font-size:13.5px}
table.lib th{text-align:left;padding:9px 12px;font-size:11.5px;letter-spacing:.5px;color:var(--ink3);border-bottom:1px solid var(--line);position:sticky;top:61px;background:var(--bg)}
table.lib td{padding:11px 12px;border-bottom:1px solid #f0ece2;vertical-align:top}
table.lib tr:hover td{background:#fbf8f0}
table.lib td:first-child{font-weight:600;white-space:nowrap}
.freq{display:inline-block;min-width:34px;padding:1px 7px;border-radius:6px;background:#efeade;font-size:11.5px;color:var(--ink2);text-align:center}
mark{background:#fbe6a2;color:inherit;padding:0 1px;border-radius:2px}

.empty{text-align:center;padding:70px 20px;color:var(--ink3)}
.empty b{display:block;font-size:16px;color:var(--ink2);margin-bottom:6px}


/* ---------- 人民日报例句 ---------- */
.egli{list-style:none;margin:0 0 9px;padding:0 0 0 11px;border-left:2px solid #e3dccb;font-size:12.5px;color:var(--ink2);line-height:1.75}
.egli .src{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:4px;background:#f2ece0;color:#8a7f6a;margin-left:6px;vertical-align:1px;letter-spacing:.3px}
.egli .src.rmrb{background:#f6e2dc;color:#a8503a}
.egli .ttl{color:var(--ink3);font-size:11.5px}
.blank{color:var(--accent);font-weight:700;letter-spacing:1px}
/* ---------- 选词填空 ---------- */
.cloze{max-width:820px;margin:0 auto}
.cz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:13px;color:var(--ink2);gap:12px;flex-wrap:wrap}
.cz-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 28px;box-shadow:var(--shadow)}
.cz-passage{font-size:15.5px;line-height:2;color:var(--ink)}
.cz-passage .bk{color:var(--accent);font-weight:700;letter-spacing:1px}
.cz-passage .fld{display:inline-block;min-width:74px;text-align:center;border-bottom:2px solid var(--accent);color:var(--accent);font-weight:700;padding:0 6px;margin:0 2px;transition:.15s}
.cz-passage .fld.filled{background:#fbf2ee;border-radius:4px 4px 0 0}
.cz-group{margin-top:20px;padding-top:16px;border-top:1px dashed var(--line)}
.cz-group h4{margin:0 0 9px;font-size:12.5px;color:var(--ink3);font-weight:600;letter-spacing:.4px}
.cz-opts{display:flex;flex-wrap:wrap;gap:8px}
.cz-opt{padding:7px 16px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:14.5px;transition:.15s}
.cz-opt:hover{border-color:#c9c0ad;background:#fbf8f0}
.cz-opt.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.cz-opt.used{opacity:.3;pointer-events:none}
.cz-opt.right{background:#eef5ef;border-color:#8cbf9f;color:#2f6a4b}
.cz-opt.wrong{background:#fbeeea;border-color:#e0a99a;color:#9c3520}
.cz-actions{display:flex;gap:10px;margin-top:22px;align-items:center;flex-wrap:wrap}
.cz-src{font-size:11.5px;color:var(--ink3);margin-left:auto}
.cz-res{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line);font-size:13px;display:none}
.cz-res.on{display:block;animation:fade .2s}
.cz-ansline{display:flex;gap:10px;align-items:baseline;margin-bottom:9px;padding-bottom:9px;border-bottom:1px solid #f2ece0}
.cz-ansline:last-child{border:none}
.cz-ansline b{color:var(--accent);min-width:64px}
.cz-ansline span{color:var(--ink2);font-size:12.5px}
@media(max-width:720px){
  .cz-card{padding:20px 18px}
  .cz-passage{font-size:15px;line-height:2.1}
}
@media(max-width:720px){
  .hd{padding:10px 14px;gap:10px;flex-wrap:wrap}
  .logo h1{font-size:14px}.logo .sub{display:none}
  nav{margin-left:auto}
  nav button{padding:5px 10px;font-size:12.5px}
  main{padding:16px 14px 60px}
  .hero h2{font-size:21px}
  .stats{gap:18px}
  .grid{grid-template-columns:1fr}
  .sheet-hd{padding:16px}
  .sheet-bd{padding:14px 16px 22px}
  .cmp,.cmp tbody,.cmp tr,.cmp td{display:block;width:100%}
  .cmp thead{display:none}
  .cmp tr{padding:14px 0;border-bottom:1px solid var(--line)}
  .cmp td{border:none;padding:2px 0}
  .cmp td.w{width:auto}
  .cmp td.def,.cmp td.key{padding-left:0}
  .fcard{padding:22px;min-height:290px}
  .fcard .big{font-size:25px}
  table.lib th{top:0}
  table.lib td:nth-child(3){display:none}
}
</style>
</head>
<body>
<header>
  <div class="hd">
    <div class="logo">
      <div class="mark">辨</div>
      <div>
        <h1>易混词语辨析闭环</h1>
        <div class="sub">逻辑填空 · 1000 高频词</div>
      </div>
    </div>
    <nav>
      <button class="on" data-page="home">辨析组</button>
      <button data-page="cloze">选词</button>
      <button data-page="flash">闪卡</button>
      <button data-page="quiz">自测</button>
      <button data-page="lib">全词库</button>
    </nav>
  </div>
</header>

<main>
  <!-- 首页 -->
  <section class="page on" id="page-home">
    <div class="hero">
      <div>
        <h2>把「长得像」的词，一次分清楚</h2>
        <p>依据《逻辑填空1000高频词闭环突破》讲义，自动抽取全部「词语辨析」关系，串联成 <b id="hgroups">156</b> 个辨析组；每组给出核心差异、命题维度与真题例句，支持按主题检索、闪卡记忆、随机自测。</p>
      </div>
      <div class="stats">
        <div class="stat"><b id="s-groups">156</b><span>辨析组</span></div>
        <div class="stat"><b id="s-words">430</b><span>易混词</span></div>
        <div class="stat"><b id="s-all">1124</b><span>总词条</span></div>
      </div>
    </div>

    <div class="toolbar">
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" placeholder="输入词语、释义或例句关键词，如「大相径庭」「相辅相成」">
      </div>
      <button class="chip on" data-size="all">全部</button>
      <button class="chip" data-size="2">两词组</button>
      <button class="chip" data-size="3">三词组</button>
      <button class="chip" data-size="4">四词以上</button>
    </div>

    <div class="themes" id="themes"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none"><b>没有匹配的辨析组</b>换个关键词试试</div>
  </section>

  <!-- 例句选词填空 -->
  <section class="page" id="page-cloze">
    <div class="cloze" id="cloze"></div>
  </section>

  <!-- 闪卡 -->
  <section class="page" id="page-flash">
    <div class="fc-wrap">
      <div class="fc-top">
        <span>闪卡记忆 · 点击卡片翻面</span>
        <span><span id="fc-idx">1</span> / <span id="fc-total">0</span></span>
      </div>
      <div class="progress"><i id="fc-bar" style="width:0%"></i></div>
      <div class="fcard" id="fcard">
        <div class="q">这组词的核心差异是？</div>
        <div class="big" id="fc-word">—</div>
        <div class="grp" id="fc-grp"></div>
        <div class="ans" id="fc-ans">
          <div class="k" id="fc-key"></div>
          <div class="d" id="fc-def"></div>
        </div>
      </div>
      <div class="fc-btns">
        <button class="btn bad" id="fc-bad">没记住</button>
        <button class="btn primary" id="fc-next">下一个 →</button>
        <button class="btn good" id="fc-good">记住了</button>
      </div>
      <div class="hint">建议先在心里说出差异，再点卡片验证</div>
    </div>
  </section>

  <!-- 自测 -->
  <section class="page" id="page-quiz">
    <div class="quiz" id="quiz"></div>
  </section>

  <!-- 词库 -->
  <section class="page" id="page-lib">
    <div class="toolbar">
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q2" placeholder="搜索全部 1124 个词条：词义、例句、关联词">
      </div>
      <button class="chip on" data-lib="all">全部</button>
      <button class="chip" data-lib="grp">易混词</button>
      <button class="chip" data-lib="solo">独立高频词</button>
    </div>
    <table class="lib">
      <thead><tr><th style="width:96px">词语</th><th style="width:62px">频次</th><th>释义</th><th style="width:30%">首条例句</th></tr></thead>
      <tbody id="libbody"></tbody>
    </table>
  </section>
</main>

<div class="modal" id="modal">
  <div class="sheet">
    <div class="sheet-hd">
      <div><h3 id="m-title"></h3><div class="meta" id="m-meta"></div></div>
      <button class="close" id="m-close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sheet-bd" id="m-body"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="cloze_data.js"></script>
<script src="cloze_src.js"></script>
<script>
/* ============ 全局 ============ */
const D = window.APP_DATA;
const THEME_MAP = Object.fromEntries(D.themes.map(t => [t.id, t.name]));
const THEME_COLOR = {'a-speed':'#b4452f','b-attitude':'#7d5a9b','c-extent':'#3a6ea5','d-relation':'#3f7d5c','e-cause':'#a5762a','f-light':'#4c7a8c','g-express':'#96536b','h-quality':'#6b7a3f','i-verb':'#8a6a4f'};

const state = { theme:'all', size:'all', q:'', lib:'all', libq:'' };
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ============ 导航 ============ */
$$('nav button').forEach(b => b.onclick = () => {
  $$('nav button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  $$('.page').forEach(p => p.classList.remove('on'));
  $('#page-' + b.dataset.page).classList.add('on');
  if (b.dataset.page === 'cloze') initCloze();
  if (b.dataset.page === 'flash') initFlash();
  if (b.dataset.page === 'quiz') initQuiz();
  if (b.dataset.page === 'lib') renderLib();
  window.scrollTo({top:0, behavior:'smooth'});
});

/* ============ 首页 ============ */
$('#s-groups').textContent = D.meta.groups;
$('#s-words').textContent = D.groups.reduce((a,g)=>a+g.words.length,0);
$('#s-all').textContent = D.meta.words;
$('#hgroups').textContent = D.meta.groups;

function renderThemes(){
  const box = $('#themes');
  const all = `<button class="tcard ${state.theme==='all'?'on':''}" data-t="all">全部主题 <em>${D.groups.length}</em></button>`;
  box.innerHTML = all + D.themes.map(t => {
    const n = D.groups.filter(g => g.theme === t.id).length;
    if (!n) return '';
    return `<button class="tcard ${state.theme===t.id?'on':''}" data-t="${t.id}">
      <span class="dot" style="background:${THEME_COLOR[t.id]}"></span>${t.name} <em>${n}</em></button>`;
  }).join('');
  box.querySelectorAll('.tcard').forEach(b => b.onclick = () => { state.theme = b.dataset.t; renderThemes(); renderGrid(); });
}

function matchGroup(g, q){
  if (!q) return true;
  const hay = g.words.join(' ') + ' ' + g.rows.map(r => r.key + r.def).join(' ');
  return hay.includes(q);
}

function renderGrid(){
  const q = state.q.trim();
  let list = D.groups.filter(g => (state.theme==='all'||g.theme===state.theme) && matchGroup(g,q));
  if (state.size==='2') list = list.filter(g=>g.words.length===2);
  if (state.size==='3') list = list.filter(g=>g.words.length===3);
  if (state.size==='4') list = list.filter(g=>g.words.length>=4);

  $('#empty').style.display = list.length ? 'none' : 'block';
  $('#grid').innerHTML = list.map(g => {
    const keys = g.rows.slice(0,3).map(r => `<div><i>${esc(r.w)}</i><span>${esc(r.key)}</span></div>`).join('');
    return `<div class="gcard" data-id="${g.id}">
      <div class="tag"><span class="dot" style="background:${THEME_COLOR[g.theme]}"></span>${THEME_MAP[g.theme]} · ${g.words.length} 词</div>
      <h3>${g.words.map(esc).join('<span class="sep">/</span>')}</h3>
      <div class="keys">${keys}</div>
      <div class="more">查看完整对比 →</div>
    </div>`;
  }).join('');
  $('#grid').querySelectorAll('.gcard').forEach(c => c.onclick = () => openGroup(c.dataset.id));
}

$('#q').oninput = e => { state.q = e.target.value; renderGrid(); };
$$('.toolbar .chip[data-size]').forEach(b => b.onclick = () => {
  $$('.toolbar .chip[data-size]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); state.size = b.dataset.size; renderGrid();
});

/* ============ 详情 ============ */
function openGroup(id){
  const g = D.groups.find(x => x.id === id);
  if (!g) return;
  $('#m-title').textContent = g.words.join(' / ');
  $('#m-meta').innerHTML = `${THEME_MAP[g.theme]} · ${g.words.length} 个易混词 · 讲义累计出现 ${g.rows.reduce((a,r)=>a+r.f,0)} 次`;
  const real = (typeof CLOZE !== 'undefined') ? CLOZE : {};
  $('#m-body').innerHTML = `<table class="cmp">
    <thead><tr><th>词语</th><th>核心差异（怎么选）</th><th style="width:44%">人民日报 / 人民网 真实用例</th></tr></thead>
    <tbody>${g.rows.map(r => {
      const cs = (real.detail && real.detail[g.id] && real.detail[g.id][r.w]) || [];
      const egHtml = cs.length
        ? cs.slice(0,3).map(c=>`<li class="egli">${esc(c.s)}<span class="src ${c.src==='人民日报'?'rmrb':''}">${esc(c.src)}</span>${c.t?`<div class="ttl">《${esc(c.t)}》</div>`:''}</li>`).join('')
        : `<li class="egli" style="border-color:#eee;color:var(--ink3)">该词暂未检索到合适的人民日报例句，可先参考释义</li>`;
      return `<tr>
      <td class="w">${esc(r.w)}<small>讲义出现 ${r.f} 次</small></td>
      <td class="key">${esc(r.key)}${r.dim?`<br><span class="dim">${esc(r.dim)}</span>`:''}
        <div style="margin-top:8px;font-size:12px;color:var(--ink3);line-height:1.7">${esc(r.def)}</div></td>
      <td><ul class="eg" style="padding-left:0">${egHtml}</ul></td>
    </tr>`;}).join('')}</tbody></table>
    <div style="margin-top:14px;font-size:11.5px;color:var(--ink3)">例句均来自人民网 / 人民日报站内检索结果，保留原句表述，仅作学习示例；点击顶部「选词」可用同组词做语境填空。</div>`;
  $('#modal').classList.add('on');
  document.body.style.overflow = 'hidden';
}
$('#m-close').onclick = closeModal;
$('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
function closeModal(){ $('#modal').classList.remove('on'); document.body.style.overflow = ''; }

/* ============ 闪卡 ============ */
const FLASH_KEY = 'ljtc_flash_v1';
let flash = { order:[], i:0, known:{}, filter:'all' };
function buildFlashPool(){
  let pool = [];
  D.groups.forEach(g => g.rows.forEach(r => pool.push({w:r.w, key:r.key, def:r.def, dim:r.dim, grp:g.words, id:g.id})));
  return pool;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function initFlash(){
  if (!flash.order.length){
    flash.order = shuffle(buildFlashPool()).map(x => x);
    try{ flash.known = JSON.parse(localStorage.getItem(FLASH_KEY) || '{}'); }catch(e){ flash.known = {}; }
  }
  drawFlash();
}
function drawFlash(){
  const c = flash.order[flash.i];
  if (!c) return;
  $('#fc-word').textContent = c.w;
  $('#fc-grp').textContent = '同组：' + c.grp.join(' / ');
  $('#fc-key').textContent = c.key;
  $('#fc-def').textContent = c.def + (c.dim ? '（考点：' + c.dim + '）' : '');
  $('#fc-ans').classList.remove('on');
  $('#fc-idx').textContent = flash.i + 1;
  $('#fc-total').textContent = flash.order.length;
  $('#fc-bar').style.width = ((flash.i) / flash.order.length * 100) + '%';
}
$('#fcard').onclick = () => $('#fc-ans').classList.toggle('on');
$('#fc-next').onclick = () => { flash.i = (flash.i + 1) % flash.order.length; drawFlash(); };
$('#fc-good').onclick = () => { const c = flash.order[flash.i]; flash.known[c.w] = 1; saveFlash(); $('#fc-next').click(); };
$('#fc-bad').onclick = () => { const c = flash.order[flash.i]; delete flash.known[c.w]; saveFlash(); $('#fc-next').click(); };
function saveFlash(){ try{ localStorage.setItem(FLASH_KEY, JSON.stringify(flash.known)); }catch(e){} }

/* ============ 自测 ============ */
let quizState = { i:0, right:0, list:[], locked:false };
function buildQuiz(){
  const pool = [];
  D.groups.forEach(g => {
    if (g.rows.length < 2) return;
    g.rows.forEach(r => {
      const others = g.rows.filter(x => x.w !== r.w);
      // 干扰项：同组其他词 + 其它组随机词
      const distract = shuffle(others.slice()).slice(0, Math.min(3, others.length));
      while (distract.length < 3){
        const cand = D.groups[Math.random()*D.groups.length|0].words;
        const w = cand[Math.random()*cand.length|0];
        if (w !== r.w && !distract.some(d=>d.w===w)) {
          const other = D.groups.flatMap(x=>x.rows).find(x=>x.w===w);
          if (other) distract.push(other);
        }
      }
      pool.push({ stem: r.key, ans: r, opts: shuffle([r, ...distract]), grp: g });
    });
  });
  return shuffle(pool).slice(0, 20);
}
function initQuiz(){
  if (quizState.list.length && quizState.i < quizState.list.length) { drawQuiz(); return; }
  quizState = { i:0, right:0, list: buildQuiz(), locked:false };
  drawQuiz();
}
function drawQuiz(){
  const box = $('#quiz');
  if (quizState.i >= quizState.list.length){
    const pct = Math.round(quizState.right / quizState.list.length * 100);
    box.innerHTML = `<div class="qcard" style="text-align:center;padding:48px 28px">
      <div style="font-size:13px;color:var(--ink3);letter-spacing:.6px">本轮完成</div>
      <div style="font-size:44px;font-weight:700;letter-spacing:-1px;margin:10px 0">${pct}<span style="font-size:20px">%</span></div>
      <div style="color:var(--ink2);font-size:14px;margin-bottom:22px">答对 ${quizState.right} / ${quizState.list.length} 题</div>
      <button class="btn primary" style="max-width:220px;margin:0 auto" onclick="quizState.list=[];initQuiz()">再来一组</button>
    </div>`;
    return;
  }
  const q = quizState.list[quizState.i];
  quizState.locked = false;
  box.innerHTML = `<div class="qbar">
      <span>第 ${quizState.i+1} / ${quizState.list.length} 题 · ${q.grp.words.join(' / ')}</span>
      <span class="score">✓ ${quizState.right}</span>
    </div>
    <div class="qcard">
      <div class="qstem">下面这句描述的是组内哪个词？<br><b>${esc(q.stem)}</b></div>
      <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="idx">${'ABCD'[i]}</span><span>${esc(o.w)}</span></button>`).join('')}</div>
      <div class="explain" id="explain"></div>
    </div>`;
  box.querySelectorAll('.opt').forEach(btn => btn.onclick = () => answer(btn, q));
}
function answer(btn, q){
  if (quizState.locked) return;
  quizState.locked = true;
  const pick = q.opts[+btn.dataset.i];
  const ok = pick.w === q.ans.w;
  if (ok) quizState.right++;
  $('#quiz').querySelectorAll('.opt').forEach(b => {
    const o = q.opts[+b.dataset.i];
    if (o.w === q.ans.w) b.classList.add('right');
    else if (o === pick) b.classList.add('wrong');
    else b.classList.add('dis');
  });
  const ex = $('#explain');
  ex.classList.add('on');
  ex.innerHTML = `<div class="why">${ok?'✅ 正确':'❌ 应为「'+esc(q.ans.w)+'」'}　<span class="dim">${esc(q.ans.dim||'考点')}</span></div>
    <div style="margin-bottom:10px">${esc(q.ans.key)}</div>
    <div style="color:var(--ink3);font-size:12.5px">释义：${esc(q.ans.def)}</div>
    <button class="btn primary" style="margin-top:16px;max-width:200px" id="nextq">下一题 →</button>`;
  $('#nextq').onclick = () => { quizState.i++; drawQuiz(); };
}

/* ============ 全词库 ============ */
let LIB = null;
function buildLib(){
  if (LIB) return LIB;
  const grpWords = new Set(D.groups.flatMap(g => g.words));
  const rows = [];
  D.groups.forEach(g => g.rows.forEach(r => rows.push({w:r.w, f:r.f, def:r.def, eg:r.egs[0]||'', g:1})));
  d_solo.forEach(r => rows.push({w:r.w, f:r.f, def:r.def, eg:r.egs[0]||'', g:0}));
  rows.sort((a,b)=>b.f-a.f);
  LIB = rows;
  return LIB;
}
function renderLib(){
  const rows = buildLib().filter(r => {
    if (state.lib==='grp' && !r.g) return false;
    if (state.lib==='solo' && r.g) return false;
    if (state.libq && !(r.w+r.def+r.eg).includes(state.libq)) return false;
    return true;
  });
  const q = state.libq;
  const hl = s => q ? esc(s).split(esc(q)).join('<mark>'+esc(q)+'</mark>') : esc(s);
  $('#libbody').innerHTML = rows.map(r => `<tr>
    <td>${hl(r.w)}${r.g?' <span style="font-size:10px;color:var(--accent)">辨</span>':''}</td>
    <td><span class="freq">${r.f}</span></td>
    <td style="color:var(--ink2)">${hl(r.def)}</td>
    <td style="color:var(--ink3);font-size:12.5px">${hl(r.eg)}</td>
  </tr>`).join('') || `<tr><td colspan="4"><div class="empty"><b>没有匹配</b>换个关键词</div></td></tr>`;
}
const d_solo = D.solo;
$('#q2').oninput = e => { state.libq = e.target.value.trim(); renderLib(); };
$$('.toolbar .chip[data-lib]').forEach(b => b.onclick = () => {
  $$('.toolbar .chip[data-lib]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); state.lib = b.dataset.lib; renderLib();
});

/* ============ 启动 ============ */
renderThemes();
renderGrid();
</script>
</body>
</html>
